# Application Configuration
app:
  name: iofog  # Application name
  uuid: ""
  controlPlane: Remote        # Control plane type: Remote or Kubernetes or Local
  namespace: iofog  # Namespace for the application (PoT: CONTROLLER_NAMESPACE=datasance)

# Server Configuration
server:
  port: 51121             # Server port number
  devMode: true
  publicUrl: "https://localhost:51121"           # Canonical external URL (CONTROLLER_PUBLIC_URL); https required in prod unless auth.insecureAllowHttp
  trustProxy: false       # Honor X-Forwarded-* when behind reverse proxy (TRUST_PROXY)
  webSocket:
    perMessageDeflate: false
    allowExtensions: false        # Disable all extensions
    pingInterval: 30000             # Ping interval in milliseconds (30 seconds)
    pongTimeout: 10000             # Pong timeout in milliseconds (10 seconds)
    handshakeTimeout: 10000      # 10 seconds
    maxPayload: 1048576          # 1MB
    maxFrameSize: 65536          # 64KB
    session:
      timeout: 3600000             # Legacy idle fallback (ms); exec uses execMaxDurationMs
      maxConnections: 100          # Maximum connections per session
      cleanupInterval: 30000       # Session cleanup interval (30 seconds)
      execPendingTimeoutMs: 60000  # Exec: user wait for agent (R81)
      execMaxDurationMs: 28800000  # Exec: max active session 8h (R81)
      execMaxConcurrentPerResource: 3  # Exec: max user WS per MS (R92)
      logPendingTimeoutMs: 120000  # Log: user wait for agent (R82)
      logIdleTimeoutMs: 7200000    # Log: idle session 2h (R82)
      logMaxConcurrentPerResource: 3  # Log: max user WS per MS or fog (R82)
      logTailMaxLines: 5000        # Log: tail query param max (R82)
      replicaMaxConcurrentWs: 500    # Scale SLO per replica (R88)
      drainTimeoutMs: 30000        # Graceful drain on SIGTERM/preStop (R85)
    relay:
      amqp:
        poolSize: 8
        sendTimeoutMs: 5000
        unsettledWarnThreshold: 1800
      nats:
        maxPendingBytes: 33554432
        maxPendingMessages: 8192
        publishTimeoutMs: 5000
    ha:
      crossReplicaRequiresAmqp: true   # Cross-replica exec/log relay requires AMQP router (R84)
      failFastOnRouterUnavailable: true
    security:
      maxConnectionsPerIp: 10
      maxRequestsPerMinute: 60
      maxPayload: 1048576  # 1MB
  # tls:
  #   path:
  #     key: ""              # TLS key file path (TLS_PATH_KEY)
  #     cert: ""             # TLS certificate file path (TLS_PATH_CERT)
  #     intermediateCert: "" # Intermediate certificate file path (TLS_PATH_INTERMEDIATE_CERT)
  #   base64:
  #     key:  # TLS key in base64 format (TLS_BASE64_KEY)
  #     cert:  # TLS certificate in base64 format (TLS_BASE64_CERT)
  #     intermediateCert: # Intermediate certificate in base64 format (TLS_BASE64_INTERMEDIATE_CERT)

# Console Configuration
console:
  port: 8008             # Console port number
  url: "http://localhost:8008"                # Console URL (CONSOLE_URL); defaults to server.publicUrl when empty

# Logging Configuration
log:
  level: info
  directory: /var/log/iofog-controller  # Log directory
  fileSize: 1073741824                   # Maximum log file size in bytes (1GB)
  fileCount: 10                          # Maximum number of log files

# Settings Configuration
settings:
  # defaultJobInterval: 120                 # Default job interval in seconds
  fogStatusUpdateInterval: 30             # Fog status update interval in seconds
  fogStatusUpdateTolerance: 3             # Fog status update tolerance
  fogExpiredTokenCleanupInterval: 300     # Fog expired token cleanup interval in seconds
  eventRetentionDays: 7                 # Days to retain events (default: 7)
  eventCleanupInterval: 86400            # Cleanup job interval in seconds (default: 24 hours)
  eventAuditEnabled: true                # Enable/disable event auditing
  eventCaptureIpAddress: true             # Capture IP address (default: true, set false for privacy compliance)
  controllerHeartbeatInterval: 30        # Controller heartbeat interval in seconds (default: 30)
  controllerInactiveThreshold: 300       # Mark controller inactive after N seconds without heartbeat (default: 300 = 5 minutes)
  controllerCleanupInterval: 600         # Controller cleanup job interval in seconds (default: 600 = 10 minutes)
  natsReconcileChunkSize: 1              # NATS reconcile task chunk size in fogs per task (default: 1)
  natsReconcileTaskStalenessSeconds: 900 # NATS reconcile task staleness for reclaim (default: 900 = 15 minutes)
  natsReconcileWorkerIntervalSeconds: 3 # NATS reconcile worker poll interval in seconds (default: 3)
  fogPlatformReconcileWorkerIntervalSeconds: 3   # Platform reconcile worker poll interval in seconds (default: 3)
  fogPlatformReconcileTaskStalenessSeconds: 300  # Stale fog platform task reclaim in seconds (default: 300 = 5 minutes)
  fogPlatformReconcileMaxAttempts: 10            # Permanent fail threshold for fog platform tasks (default: 10)
  fogPlatformReconcileBackoffBaseSeconds: 5      # Exponential backoff base for fog platform tasks (default: 5)
  fogPlatformSweepIntervalSeconds: 900           # Platform drift sweep interval in seconds (default: 900 = 15 minutes)
  servicePlatformReconcileMaxAttempts: 10        # Permanent fail threshold for service platform tasks (default: 10)
  hubRouterConfigLockTimeoutSeconds: 120         # Hub router ConfigMap lock wait in seconds (default: 120)
  serviceLoadBalancerWatchTimeoutSeconds: 300    # LoadBalancer IP watch timeout in service reconcile (default: 300)
  jobStartupDelaySeconds: 3                      # Delay before reconcile-heavy background jobs start (default: 3)
  wsSessionReconcileIntervalSeconds: 60          # WS exec/log stale DB row reconcile interval (R89)

# Database Configuration
database:
  provider: sqlite     # Database provider (sqlite/mysql/postgres)
  # mysql:
  #   host: ""    # MySQL host
  #   port: 3306          # MySQL port
  #   username: ""        # MySQL username
  #   password: ""        # MySQL password
  #   databaseName: ""   # MySQL database name
  #   useSSL: false       # Use SSL for MySQL connection
  #   sslCA: ""           # MySQL SSL CA in base64 encoded string
  # postgres:
  #   host: ""   # PostgreSQL host
  #   port: 5432         # PostgreSQL port
  #   username: ""       # PostgreSQL username
  #   password: ""       # PostgreSQL password
  #   databaseName: ""  # PostgreSQL database name
  #   useSSL: false       # Use SSL for PostgreSQL connection
  #   sslCA: ""           # PostgreSQL SSL CA in base64 encoded string
  sqlite:
    databaseName: controller_db.sqlite  # SQLite database file name
    logging: false     # Enable SQLite query logging
    transactionType: IMMEDIATE      # SQLite transaction type
    pragmas:
      journalMode: WAL              # WAL allows concurrent readers during writes (production single-node)
      busyTimeoutMs: 10000          # Wait up to 10s for lock before SQLITE_BUSY
      synchronous: NORMAL           # Safe with WAL; better write throughput than FULL
    pool:
      maxActive: 1     # Maximum active connections
      max: 1          # Maximum total connections
      min: 0          # Minimum connections
      idle: 20000     # Idle timeout in milliseconds

# Auth Configuration (OIDC — any compliant provider; env: OIDC_* / AUTH_* per naming-map §13)
auth:
  mode: embedded        # embedded | external (AUTH_MODE); resolution
  insecureAllowHttp: false  # Allow http CONTROLLER_PUBLIC_URL in prod (AUTH_INSECURE_ALLOW_HTTP)
  bootstrap:
#     username: ""  # Bootstrap admin username (OIDC_BOOTSTRAP_ADMIN_USERNAME)
#     password: ""  # Bootstrap admin password (OIDC_BOOTSTRAP_ADMIN_PASSWORD)
  insecureAllowBootstrapLog: false  # Allow bootstrap log in prod (AUTH_INSECURE_ALLOW_BOOTSTRAP_LOG)
#   issuerUrl:      # OIDC issuer URL (OIDC_ISSUER_URL); external mode only
#   client:
#     id:           # Controller API client ID (OIDC_CLIENT_ID)
#     secret:       # Controller API client secret (OIDC_CLIENT_SECRET)
#   consoleClient:   # EdgeOps Console SPA client ID (OIDC_CONSOLE_CLIENT_ID)
#   rateLimit:
#     enabled: true                 # AUTH_RATE_LIMIT_ENABLED
#     maxRequestsPerWindow: 60      # AUTH_RATE_LIMIT_MAX_REQUESTS — per-IP auth endpoints
#     windowMs: 60000               # AUTH_RATE_LIMIT_WINDOW_MS — sliding window (ms)
#   sessionStore:
#     type: memory                  # memory | database (AUTH_SESSION_STORE_TYPE); auto database for mysql/postgres
#     ttlMs: 600000                 # AUTH_SESSION_STORE_TTL_MS — OAuth BFF session TTL (10 min)
#     secret: ""                    # AUTH_SESSION_SECRET — optional; auto-generated and persisted when unset
#   tokenTtl:
#     accessTokenTtlSeconds: 900    # AUTH_ACCESS_TOKEN_TTL_SECONDS — runtime override (default from AuthPolicy)
#     refreshTokenTtlSeconds: 3600  # AUTH_REFRESH_TOKEN_TTL_SECONDS — runtime override (default 1h from AuthPolicy)
#   oidcTtl:
#     interactionTtlSeconds:        # AUTH_OIDC_INTERACTION_TTL_SECONDS — defaults to sessionStore.ttlMs / 1000
#     grantTtlSeconds:              # AUTH_OIDC_GRANT_TTL_SECONDS — defaults to interactionTtlSeconds
#     sessionTtlSeconds:            # AUTH_OIDC_SESSION_TTL_SECONDS — defaults to AuthPolicy refresh_token_ttl_seconds
#     idTokenTtlSeconds:            # AUTH_OIDC_ID_TOKEN_TTL_SECONDS — defaults to AuthPolicy access_token_ttl_seconds

# Build flavor (override via env or Docker build-arg)
flavor:
  distribution: datasance
  rbacApiVersion: datasance.com/v3
  serviceAnnotationTag: service.iofog.org/tag
  componentLabelDomain: iofog.org/component

# Bridge Ports Configuration for Services
bridgePorts:
  range: "10024-65535"  # Bridge ports range

# System Images Configuration
systemImages:
  router:
    "1": "ghcr.io/eclipse-iofog/router:latest"
    "2": "ghcr.io/eclipse-iofog/router:latest"
    "3": "ghcr.io/eclipse-iofog/router:latest"
    "4": "ghcr.io/eclipse-iofog/router:latest"
  debug:
    "1": "ghcr.io/eclipse-iofog/debugger:latest"
    "2": "ghcr.io/eclipse-iofog/debugger:latest"
    "3": "ghcr.io/eclipse-iofog/debugger:latest"
    "4": "ghcr.io/eclipse-iofog/debugger:latest"
  nats:
    "1": "ghcr.io/eclipse-iofog/nats:latest"
    "2": "ghcr.io/eclipse-iofog/nats:latest"
    "3": "ghcr.io/eclipse-iofog/nats:latest"
    "4": "ghcr.io/eclipse-iofog/nats:latest"

# NATS Configuration
nats:
  enabled: true

# Vault Configuration (for compliance with NIST, ISO 27001, NATO, IEC 62443)
# When enabled, sensitive data (secrets, certificates, private keys) will be stored
# in the configured vault provider instead of encrypted in the database
# vault:
#   enabled: false         # Enable/disable vault integration
#   provider: hashicorp  # Provider: hashicorp, openbao, vault, aws, aws-secrets-manager, azure, azure-key-vault, google, google-secret-manager
#   basePath: "pot/$namespace/secrets"  # Base path for secrets in vault ($namespace will be replaced with app.namespace)
#   # HashiCorp Vault configuration
#   hashicorp:
#     address: "http://localhost:8200"  # Vault server address (can also be set via VAULT_HASHICORP_ADDRESS env var)
#     token: ""  # Vault token (can also be set via VAULT_HASHICORP_TOKEN env var)
#     mount: "kv"  # Vault mount point (can also be set via VAULT_HASHICORP_MOUNT env var)
#   # AWS Secrets Manager configuration
#   aws:
#     region: "us-east-1"  # AWS region (can also be set via VAULT_AWS_REGION or AWS_REGION env var)
#     accessKeyId: ""  # AWS access key ID (can also be set via VAULT_AWS_ACCESS_KEY_ID or AWS_ACCESS_KEY_ID env var)
#     accessKey: ""  # AWS secret access key (can also be set via VAULT_AWS_ACCESS_KEY or AWS_SECRET_ACCESS_KEY env var)
#   # Azure Key Vault configuration
#   azure:
#     url: "https://your-vault.vault.azure.net"  # Azure Key Vault URL (can also be set via VAULT_AZURE_URL env var)
#     tenantId: ""  # Azure tenant ID (can also be set via VAULT_AZURE_TENANT_ID or AZURE_TENANT_ID env var)
#     clientId: ""  # Azure client ID (can also be set via VAULT_AZURE_CLIENT_ID or AZURE_CLIENT_ID env var)
#     clientSecret: ""  # Azure client secret (can also be set via VAULT_AZURE_CLIENT_SECRET or AZURE_CLIENT_SECRET env var)
#   # Google Secret Manager configuration
#   google:
#     projectId: ""  # Google Cloud project ID (required, can also be set via VAULT_GOOGLE_PROJECT_ID env var)
#     credentials: ""  # Path to service account key file (can also be set via VAULT_GOOGLE_CREDENTIALS or GOOGLE_APPLICATION_CREDENTIALS env var)

# OpenTelemetry Configuration
# otel:
#   enabled: false         # true/disable OpenTelemetry
#   serviceName: "pot-controller"  # Service name for traces
#   endpoint: "http://localhost:4318/v1/traces"  # OTel endpoint
#   protocol: http/protobuf       # Exporter OTLP Protocol (grpc or http/protobuf)
#   headers: ""  # A list of headers to apply to all outgoing data (traces, metrics, and logs).
#   resourceAttributes: "service.version=3.5.0,deployment.environment=production,team=devops"  # Resource attributes
#   metrics:
#     exporter: otlp      # Otel metrics exporter
#     interval: 1000      # Metrics collection interval in ms
#   logs:
#     level: info       # Log level
#   propagators: "tracecontext,baggage"  # Context propagation
#   traces:
#     sampler: "parentbased_traceidratio"       # Sampler to be used for traces
#     samplerArg: 0.1
#   batch: # Batch size and timeout for telemetry data
#     size: 512      # Maximum batch size
#     delay: 1000    # Delay interval (in milliseconds) between two consecutive exports
